# GitLab CI/CD pipeline for the NetAppsPay iOS SDK.
#
# Three stages:
#   • validate — runs on every push / MR. Builds the SPM package for the iOS
#                simulator and runs the unit tests.
#   • mirror   — pushes branches and tags to the public GitHub repo. CocoaPods
#                resolves `s.source` from that mirror, so the tag MUST land
#                there before `publish` runs.
#   • publish  — runs ONLY on semver tags (e.g. `1.1.0`). Verifies the tag,
#                the podspec and PaymentSDK.version all agree, then pushes the
#                podspec to the CocoaPods trunk.
#
# Required CI/CD variables (Settings → CI/CD → Variables in GitLab):
#   MIRROR_SSH_PRIVATE_KEY — deploy key with write access to the GitHub mirror
#   COCOAPODS_TRUNK_TOKEN  — `pod trunk` auth token (Mask + Protect).
#                            Obtain with: pod trunk register <email> '<name>'
#                            then read ~/.netrc on the machine that registered.
#
# Tagging convention: `1.1.0` (no `v` prefix — must equal `s.version` in the
# podspec AND `PaymentSDK.version`).
#
# RUNNER REQUIREMENT: `validate` and `publish` need macOS with Xcode. On
# GitLab.com that means the `saas-macos-*` runners, which are a PAID tier. If
# this project is on the free tier, either register a self-hosted macOS runner
# and swap the `tags:` below to match it, or delete these two jobs and run the
# equivalent locally:
#   xcodebuild test -scheme NetAppsPaySDK -destination 'platform=iOS Simulator,name=iPhone 15'
#   pod trunk push NetAppsPaySDK.podspec --allow-warnings
#
# RELEASE ORDER (cross-repo): this SDK and the Android SDK must both be
# published BEFORE @netappsng/react-native-pay, whose podspec pins
# `NetAppsPaySDK '~> 1.1'`. Publishing the RN bridge first ships a package whose
# native dependency cannot resolve.

stages:
  - validate
  - mirror
  - publish

# ─── validate ──────────────────────────────────────────────────────
# Every push and merge request. Catches a broken SDK before it can be tagged.
validate:
  stage: validate
  tags:
    - saas-macos-medium-m1
  image: macos-14-xcode-15
  variables:
    DESTINATION: "platform=iOS Simulator,name=iPhone 15"
  script:
    - swift --version
    - xcodebuild test -scheme NetAppsPaySDK -destination "$DESTINATION" -resultBundlePath TestResults.xcresult
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  artifacts:
    when: always
    paths:
      - TestResults.xcresult
    expire_in: 30 days

# ─── mirror ────────────────────────────────────────────────────────
# Mirrors branches AND tags to GitHub. CocoaPods clones `s.source` from there,
# so this must succeed before `publish` can resolve the tag.
mirror_to_talktothelaw:
  stage: mirror
  image: alpine:latest
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
    MIRROR_URL: "git@github.com:talktothelaw/netapps-pay-ios.git"
  before_script:
    - apk add --no-cache git openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$MIRROR_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
    - git config --global user.email "nwokolawrence6@gmail.com"
    - git config --global user.name "Lawrence Nwoko"
  script:
    - git remote remove mirror 2>/dev/null || true
    - git remote add mirror "$MIRROR_URL"
    - git fetch origin "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
    - git push --prune mirror "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"

# ─── publish ───────────────────────────────────────────────────────
# Triggered by a semver tag pushed to GitLab:
#   git tag 1.1.0 && git push origin 1.1.0
#
# The tag MUST equal `s.version` in NetAppsPaySDK.podspec and
# `PaymentSDK.version`. CocoaPods resolves `s.source` by that tag, so a
# mismatch means trunk either fails to clone or publishes the wrong commit.
publish:
  stage: publish
  tags:
    - saas-macos-medium-m1
  image: macos-14-xcode-15
  variables:
    DESTINATION: "platform=iOS Simulator,name=iPhone 15"
  script:
    # 1. Three-way version guard: git tag ↔ podspec ↔ PaymentSDK.version.
    - |
      PODSPEC_VERSION=$(grep -E 's\.version\s*=' NetAppsPaySDK.podspec | head -1 | sed -E 's/.*"(.*)".*/\1/')
      SOURCE_VERSION=$(grep -E 'public static let version *= *"' Sources/NetAppsPaySDK/PaymentSDK.swift | sed -E 's/.*"(.*)".*/\1/')
      echo "tag=$CI_COMMIT_TAG podspec=$PODSPEC_VERSION source=$SOURCE_VERSION"
      if [ "$CI_COMMIT_TAG" != "$PODSPEC_VERSION" ]; then
        echo "ERROR: git tag '$CI_COMMIT_TAG' != NetAppsPaySDK.podspec s.version '$PODSPEC_VERSION'"
        exit 1
      fi
      if [ "$CI_COMMIT_TAG" != "$SOURCE_VERSION" ]; then
        echo "ERROR: git tag '$CI_COMMIT_TAG' != PaymentSDK.version '$SOURCE_VERSION'"
        exit 1
      fi
    # 2. Never publish an untested build — a tag pipeline skips `validate`.
    - xcodebuild test -scheme NetAppsPaySDK -destination "$DESTINATION"
    # 3. The tag must already exist on the GitHub mirror, because `s.source`
    #    points there and trunk clones it during validation. The `mirror` stage
    #    runs first in this same pipeline; confirm it actually landed.
    - |
      if ! git ls-remote --tags https://github.com/talktothelaw/netapps-pay-ios.git "refs/tags/$CI_COMMIT_TAG" | grep -q "$CI_COMMIT_TAG"; then
        echo "ERROR: tag '$CI_COMMIT_TAG' is not on the GitHub mirror yet — CocoaPods cannot resolve s.source"
        exit 1
      fi
    # 4. Lint against the real remote source, then publish.
    - pod lib lint NetAppsPaySDK.podspec --allow-warnings
    - pod trunk push NetAppsPaySDK.podspec --allow-warnings
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  environment:
    name: cocoapods-trunk
    url: https://cocoapods.org/pods/NetAppsPaySDK
